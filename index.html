<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Rayan Djanati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#111111;
    --gray-mid:#6e6e6e;
    --gray-line:#e2e2e2;
    --gray-soft:#f6f6f6;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- layout shell ---------- */
  .wrap{max-width:920px;margin:0 auto;padding:0 24px;}

  /* ---------- nav ---------- */
  nav{
    display:flex;justify-content:space-between;align-items:center;
    padding:28px 0;border-bottom:1px solid var(--gray-line);
  }
  nav .brand{font-family:'IBM Plex Mono';font-size:12px;letter-spacing:0.08em;text-transform:uppercase;}
  nav ul{display:flex;gap:28px;list-style:none;}
  nav a{color:var(--ink);text-decoration:none;font-size:13px;letter-spacing:0.02em;opacity:0.75;transition:opacity .2s;}
  nav a:hover, nav a:focus-visible{opacity:1;}

  /* ---------- hero ---------- */
  header.hero{padding:100px 0 70px;}
  .hero .eyebrow{
    font-family:'IBM Plex Mono';font-size:12px;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--gray-mid);margin-bottom:22px;
    display:flex;align-items:center;gap:10px;
  }
  .hero .eyebrow::before{content:"";width:22px;height:1px;background:var(--gray-mid);display:inline-block;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(48px,8vw,84px);
    line-height:0.98;
    letter-spacing:-0.01em;
    max-width:11ch;
  }
  h1 em{font-style:italic;font-weight:400;}
  .brand-logo{
    display:block;height:34px;margin-top:24px;
  }
  .hero p.role{
    margin-top:26px;font-size:17px;color:var(--gray-mid);max-width:46ch;line-height:1.55;
  }
  .hero p.role strong{color:var(--ink);font-weight:500;}

  /* ---------- section labels ---------- */
  .section-label{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:14px 0;margin-top:60px;border-bottom:1px solid var(--ink);
  }
  .section-label h2{
    font-family:'IBM Plex Mono';font-size:12px;letter-spacing:0.12em;text-transform:uppercase;
  }
  .section-label span{font-family:'IBM Plex Mono';font-size:12px;color:var(--gray-mid);}

  /* ---------- rundown (conducteur) ---------- */
  .rundown{border-bottom:1px solid var(--gray-line);}
  .row{
    display:grid;
    grid-template-columns:1fr 140px 20px;
    align-items:center;
    gap:18px;
    padding:22px 0;
    border-top:1px solid var(--gray-line);
    cursor:pointer;
    transition:background .2s;
  }
  .row:hover, .row:focus-visible{background:var(--gray-soft);}
  .row:hover .row-title, .row.open .row-title{text-decoration-color:var(--ink);}
  .row .idx{font-family:'IBM Plex Mono';font-size:13px;color:var(--gray-mid);}
  .row .tc{font-family:'IBM Plex Mono';font-size:13px;color:var(--gray-mid);}
  .row-title{
    font-family:'Fraunces',serif;font-weight:500;font-size:19px;
    text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;
    transition:text-decoration-color .2s;
  }
  .row .cat{
    font-family:'IBM Plex Mono';font-size:11px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--gray-mid);text-align:right;
  }
  .row .chevron{
    width:20px;height:20px;position:relative;justify-self:end;
  }
  .row .chevron::before, .row .chevron::after{
    content:"";position:absolute;background:var(--ink);top:9px;
  }
  .row .chevron::before{width:12px;height:1px;left:4px;}
  .row .chevron::after{width:1px;height:12px;left:9px;top:4px;transition:transform .25s;}
  .row.open .chevron::after{transform:scaleY(0);}

  .panel{
    max-height:0;overflow:hidden;transition:max-height .35s ease;
    grid-column:1 / -1;
  }
  .row-wrap{border-top:1px solid var(--gray-line);}
  .row-wrap:first-child{border-top:none;}
  .panel-inner{padding:0 0 34px 0;}
  .video-slot{
    aspect-ratio:16/9;background:var(--gray-soft);border:1px solid var(--gray-line);
    display:flex;align-items:center;justify-content:center;text-align:center;
    max-width:560px;margin-bottom:18px;position:relative;overflow:hidden;
  }
  .video-slot iframe{width:100%;height:100%;border:0;}
  .video-slot .placeholder{
    font-family:'IBM Plex Mono';font-size:12px;color:var(--gray-mid);padding:24px;line-height:1.6;
  }
  .video-thumb{
    position:relative;display:block;width:100%;height:100%;
    background-size:cover;background-position:center;text-decoration:none;
    border:0;padding:0;cursor:pointer;font:inherit;
  }
  .video-thumb::after{
    content:"";position:absolute;inset:0;background:rgba(0,0,0,0.15);transition:background .2s;
  }
  .video-thumb:hover::after, .video-thumb:focus-visible::after{background:rgba(0,0,0,0.3);}
  .play-btn{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:56px;height:56px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;z-index:1;
    transition:transform .2s;
  }
  .video-thumb:hover .play-btn{transform:translate(-50%,-50%) scale(1.08);}
  .play-btn::before{
    content:"";border-style:solid;border-width:9px 0 9px 15px;
    border-color:transparent transparent transparent var(--ink);margin-left:4px;
  }
  .watch-label{
    position:absolute;bottom:12px;right:12px;z-index:1;
    font-family:'IBM Plex Mono';font-size:10px;letter-spacing:0.06em;text-transform:uppercase;
    color:#fff;background:rgba(0,0,0,0.55);padding:4px 8px;
  }
  .panel-inner p.desc{max-width:56ch;font-size:15px;line-height:1.6;color:#333;}
  .meta-line{
    display:flex;gap:18px;margin-top:14px;font-family:'IBM Plex Mono';font-size:11px;color:var(--gray-mid);
  }

  /* ---------- footer / contact ---------- */
  footer{padding:90px 0 60px;margin-top:60px;border-top:1px solid var(--gray-line);}
  footer h2{
    font-family:'Fraunces',serif;font-weight:400;font-style:italic;font-size:32px;max-width:14ch;
  }
  .contact-links{display:flex;gap:30px;margin-top:0;flex-wrap:wrap;}
  .contact-links a{
    color:var(--ink);text-decoration:none;font-size:14px;
    border-bottom:1px solid var(--ink);padding-bottom:2px;
  }
  footer .foot-note{
    margin-top:60px;font-family:'IBM Plex Mono';font-size:11px;color:var(--gray-mid);
  }

  @media (max-width:640px){
    .row{grid-template-columns:1fr 20px;}
    .row .tc, .row .cat{display:none;}
    .panel-inner{padding:0 0 30px 0;}
    nav ul{gap:16px;}
  }
</style>
</head>

<script>
/* =====================================================================
   AJOUTE TES SUJETS ICI.
   - title       : titre du sujet (le seul champ obligatoire)
   - category    : rubrique (France, International, Société, Éco...)
   - date        : date de diffusion, format libre ("12.03.2026") — optionnel
   - youtubeId   : juste l'ID de la vidéo YouTube (11 caractères), ex :
                    pour https://youtu.be/Vg9pnWVLVmQ  →  "Vg9pnWVLVmQ"
                    (laisse vide "" tant que la vidéo n'est pas en ligne —
                     un placeholder s'affichera à la place)
   ===================================================================== */
const SUJETS = [
  { title: "Aude : frapper vite et fort", category: "France", date: "—", vimeoId: "1218871545" },
  { title: "L'Iran attaque des pétroliers et des réservoirs", category: "International", date: "—", vimeoId: "1218871857" },
  { title: "Éclipse solaire : le meilleur spot", category: "France", date: "—", vimeoId: "1218871546" },
  { title: "Zidane : le jour Z", category: "France", date: "—", vimeoId: "1218871859" },
  { title: "Le démarchage téléphonique raccroche", category: "France", date: "—", vimeoId: "1218871547" },
  { title: "Canicule : les gagnants, les perdants", category: "France", date: "—", vimeoId: "1218871856" },
  { title: "Éruption Fuego Guatemala : 1700 personnes évacuées", category: "International", date: "—", vimeoId: "1218871565" },
  { title: "Marseille : le facteur n'est pas passé…", category: "France", date: "—", vimeoId: "1218871858" },
  { title: "Lège Cap Ferret : le difficile retour", category: "France", date: "—", vimeoId: "1218871560" },
  { title: "Feuilles d'automne en été", category: "France", date: "—", vimeoId: "1218871548" }
];

const list = document.getElementById('rundownList');
document.getElementById('rowCount').textContent =
  String(SUJETS.length).padStart(2,'0') + (SUJETS.length > 1 ? ' éléments' : ' élément');

SUJETS.forEach((s, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'row-wrap';

  const row = document.createElement('div');
  row.className = 'row';
  row.tabIndex = 0;
  row.setAttribute('role','button');
  row.setAttribute('aria-expanded','false');
  row.innerHTML = `
    <span class="row-title">${s.title}</span>
    <span class="cat">${s.category}</span>
    <span class="chevron"></span>
  `;

  const panel = document.createElement('div');
  panel.className = 'panel';
  let embed;
  if (s.vimeoId) {
    embed = `<button type="button" class="video-thumb" data-vimeo-id="${s.vimeoId}" aria-label="Lire la vidéo : ${s.title}"
         style="background-image:url('https://vumbnail.com/${s.vimeoId}_large.jpg')">
         <span class="play-btn"></span>
       </button>`;
  } else if (s.youtubeId) {
    embed = `<a class="video-thumb" href="https://www.youtube.com/watch?v=${s.youtubeId}" target="_blank" rel="noopener"
         style="background-image:url('https://img.youtube.com/vi/${s.youtubeId}/hqdefault.jpg')">
         <span class="play-btn"></span>
         <span class="watch-label">Voir sur YouTube</span>
       </a>`;
  } else {
    embed = `<div class="placeholder">Vidéo à venir<br>— colle l'ID Vimeo ou YouTube dans SUJETS[${i}] —</div>`;
  }
  panel.innerHTML = `
    <div class="panel-inner">
      <div class="video-slot">${embed}</div>
      <div class="meta-line"><span>${s.date}</span><span>${s.category}</span></div>
    </div>
  `;

  if (s.vimeoId) {
    const thumbBtn = panel.querySelector('.video-thumb');
    thumbBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const slot = thumbBtn.closest('.video-slot');
      slot.innerHTML = `<iframe
          src="https://player.vimeo.com/video/${s.vimeoId}?autoplay=1&title=0&byline=0&portrait=0"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
          allowfullscreen></iframe>`;
    });
  }

  function toggle(){
    const isOpen = row.classList.toggle('open');
    row.setAttribute('aria-expanded', String(isOpen));
    panel.style.maxHeight = isOpen ? panel.scrollHeight + 'px' : '0px';
  }
  row.addEventListener('click', toggle);
  row.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
  });

  wrap.appendChild(row);
  wrap.appendChild(panel);
  list.appendChild(wrap);
});
</script>
